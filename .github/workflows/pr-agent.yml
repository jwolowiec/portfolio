name: PR Agent

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  issues: write
  contents: read

jobs:
  code_review:
    runs-on: ubuntu-latest
    if: >
      github.event.issue.pull_request != '' &&
      contains(fromJson('["OWNER", "COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: PR Agent action step
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_API_BASE: "https://ollama.com"
          config.model: "ollama/gpt-oss:120b"
          config.fallback_models: '["ollama/gpt-oss:20b"]'
          config.custom_model_max_tokens: "200000"
          pr_reviewer.require_score_review: "true"
          pr_reviewer.require_security_review: "true"
          pr_reviewer.require_todo_scan: "true"
          pr_reviewer.inline_code_comments: "true"
          pr_code_suggestions.commitable_code_suggestions: "true"
