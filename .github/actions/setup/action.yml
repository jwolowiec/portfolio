name: 'Setup Node and Install'
description: 'Checks out code, sets up Node.js, and installs dependencies'
runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
      shell: bash
